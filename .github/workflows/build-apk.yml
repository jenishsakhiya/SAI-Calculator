name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu-latest runner already has the Android SDK (ANDROID_HOME is set);
      # Gradle downloads any missing SDK platform automatically.

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SAI-Soft-Jaws-Calculator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SAI-Soft-Jaws-Calculator
          path: SAI-Soft-Jaws-Calculator.apk